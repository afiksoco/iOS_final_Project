name: Demo video

# Records a walkthrough of the app on a GitHub-hosted macOS runner.
#
# `xcrun simctl io recordVideo` captures the simulator's screen while an
# XCUITest drives the app, so the result is genuine footage of the real app
# talking to the real Firebase project - not a mockup.
#
# Alongside the video, the host samples periodic screenshots. Those get
# committed as small PNGs, which makes it possible to check what the
# walkthrough actually did without downloading the video (artifact downloads
# need authentication; files in the repo do not).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'HabitPulseUITests/**'
      - '.github/workflows/demo-video.yml'

permissions:
  contents: write

concurrency:
  group: demo-video
  cancel-in-progress: true

jobs:
  record:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "ffmpeg:    $(command -v ffmpeg    || echo MISSING)"
          echo "avconvert: $(command -v avconvert || echo MISSING)"
          echo "sips:      $(command -v sips      || echo MISSING)"

      - name: Pick a simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available \
                 | grep -oE 'iPhone 1[5-9][^(]*' | head -1 | sed 's/ *$//')
          [ -z "$NAME" ] && NAME=$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*' | head -1 | sed 's/ *$//')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $NAME"

      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.name }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.name }}" -b
          # Silence the first-run keyboard tutorials - they float over the
          # app and cover whatever is behind them.
          for d in com.apple.Preferences com.apple.keyboard.preferences; do
            xcrun simctl spawn "${{ steps.sim.outputs.name }}" defaults write $d DidShowContinuousPathIntroduction -bool true 2>/dev/null || true
            xcrun simctl spawn "${{ steps.sim.outputs.name }}" defaults write $d DidShowGestureKeyboardIntroduction -bool true 2>/dev/null || true
            xcrun simctl spawn "${{ steps.sim.outputs.name }}" defaults write $d KeyboardDidShowProductivityTutorial -bool true 2>/dev/null || true
          done
          xcrun simctl spawn "${{ steps.sim.outputs.name }}" defaults write com.apple.Preferences KeyboardAutocorrection -bool false 2>/dev/null || true
          xcrun simctl spawn "${{ steps.sim.outputs.name }}" defaults write com.apple.Preferences KeyboardPrediction -bool false 2>/dev/null || true
          xcrun simctl status_bar "${{ steps.sim.outputs.name }}" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --cellularMode active --cellularBars 4 --wifiMode active --wifiBars 3 || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project HabitPulse.xcodeproj \
            -scheme HabitPulse \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -30

      - name: Record while the UI test drives the app
        id: record
        continue-on-error: true
        run: |
          set -o pipefail
          SIM="${{ steps.sim.outputs.name }}"
          mkdir -p artifacts shots

          xcrun simctl io "$SIM" recordVideo --codec h264 --force artifacts/demo-raw.mov &
          echo "REC_PID=$!" >> "$GITHUB_ENV"
          REC_PID=$!

          # Sample the screen from the host every 2s, independently of the
          # video, so there is a frame-by-frame record to inspect later.
          ( i=0
            while [ $i -lt 300 ]; do
              xcrun simctl io "$SIM" screenshot --type png "shots/f$(printf '%03d' $i).png" >/dev/null 2>&1
              i=$((i+1)); sleep 2
            done ) &
          SHOT_PID=$!
          sleep 3

          xcodebuild test-without-building \
            -project HabitPulse.xcodeproj \
            -scheme HabitPulse \
            -destination "platform=iOS Simulator,name=$SIM" \
            -only-testing:HabitPulseUITests/DemoUITests/testDemoWalkthrough \
            2>&1 | tail -50 || echo "walkthrough reported a failure - keeping the footage"

          sleep 2
          kill $SHOT_PID 2>/dev/null || true
          kill -INT $REC_PID 2>/dev/null || true
          wait $REC_PID 2>/dev/null || true
          sleep 3
          ls -la artifacts/ ; echo "screenshots: $(ls shots | wc -l)"

      - name: Package video and frames
        if: always()
        run: |
          mkdir -p docs docs/frames
          RAW=artifacts/demo-raw.mov

          # --- video: prefer a real mp4, fall back to the .mov as recorded ---
          if [ -s "$RAW" ]; then
            if command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -y -i "$RAW" -c:v libx264 -preset slow -crf 24 \
                     -pix_fmt yuv420p -movflags +faststart docs/demo.mp4 2>&1 | tail -3
            elif command -v avconvert >/dev/null 2>&1; then
              avconvert --preset PresetHighQuality --source "$RAW" \
                        --output docs/demo.mp4 --replace 2>&1 | tail -3 || true
            fi
            # simctl records H.264 in an ISO-BMFF container, so if neither
            # transcoder is present the raw file is still a perfectly good
            # deliverable - just keep its own extension.
            if [ ! -s docs/demo.mp4 ]; then
              cp "$RAW" docs/demo.mov
            fi
          fi

          # --- frames: a dozen evenly spaced stills, downscaled ---
          COUNT=$(ls shots/*.png 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -gt 0 ]; then
            STEP=$(( COUNT / 24 )); [ "$STEP" -lt 1 ] && STEP=1
            i=0; n=0
            for f in $(ls shots/*.png); do
              if [ $(( i % STEP )) -eq 0 ] && [ "$n" -lt 24 ]; then
                sips -Z 620 "$f" --out "docs/frames/$(printf 'frame-%02d' $n).png" >/dev/null 2>&1 && n=$((n+1))
              fi
              i=$((i+1))
            done
            echo "kept $n frames of $COUNT"
          fi
          ls -lh docs docs/frames 2>/dev/null | head -30

      - name: Write demo report
        if: always()
        run: |
          {
            echo "# Demo recording report"
            echo
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
            echo "- simulator: \`${{ steps.sim.outputs.name }}\`"
            echo "- walkthrough step: **${{ steps.record.outcome }}**"
            echo "- ffmpeg: \`$(command -v ffmpeg || echo MISSING)\`"
            echo "- avconvert: \`$(command -v avconvert || echo MISSING)\`"
            echo
            echo "## Output"
            echo '```'
            ls -lh docs/demo.mp4 docs/demo.mov 2>/dev/null || echo "no video produced"
            echo "raw footage: $(ls -lh artifacts/demo-raw.mov 2>/dev/null | awk '{print $5}' || echo none)"
            echo "screenshots sampled: $(ls shots/*.png 2>/dev/null | wc -l | tr -d ' ')"
            echo "frames committed:    $(ls docs/frames/*.png 2>/dev/null | wc -l | tr -d ' ')"
            echo '```'
          } > docs/DEMO_REPORT.md
          cat docs/DEMO_REPORT.md

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-video
          path: |
            docs/
            artifacts/demo-raw.mov
          if-no-files-found: warn
          retention-days: 30

      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "ci: record demo walkthrough [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
